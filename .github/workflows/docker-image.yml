# main 에 push 되면 린트 · 빌드 확인 후 웹 이미지를 GHCR 에 올린다 → 서버에서 BE/deploy/deploy.sh 로 받는다
# 결제 공개 키는 빌드할 때 박힌다 — 저장소 Settings → Secrets and variables → Actions → Variables 에 등록
#   PAYMENT_PROVIDER (nicepay) · NICEPAY_CLIENT_ID · PORTONE_STORE_ID · PORTONE_CHANNEL_KEY
name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/doldolred/fe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_PAYMENT_PROVIDER=${{ vars.PAYMENT_PROVIDER || 'nicepay' }}
            VITE_NICEPAY_CLIENT_ID=${{ vars.NICEPAY_CLIENT_ID }}
            VITE_PORTONE_STORE_ID=${{ vars.PORTONE_STORE_ID }}
            VITE_PORTONE_CHANNEL_KEY=${{ vars.PORTONE_CHANNEL_KEY }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
